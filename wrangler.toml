name = "wildstats"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# R2 binding for local `wrangler pages dev` development.
# In production, configure this binding in the Cloudflare Dashboard:
#   Pages → wildstats → Settings → Functions → R2 bucket bindings
#   Binding name: H2H_DATA  →  Bucket: wildstats-data (or your bucket name)
[[r2_buckets]]
binding = "H2H_DATA"
bucket_name = "wildstats-data"
preview_bucket_name = "wildstats-data"
