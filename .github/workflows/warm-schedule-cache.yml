name: Warm team schedules cache

# Runs every 55 minutes so R2 is always pre-populated before the 1hr TTL expires.
# This ensures the 32 NHL API batch calls happen server-side, not during a user request.
on:
  schedule:
    - cron: '*/55 * * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh all-team-schedules R2 cache
        run: |
          # Season rolls over in October (matches getCurrentSeasonStartYear in scripts/)
          YEAR=$(date -u +%Y); MONTH=$(date -u +%-m)
          if [ "$MONTH" -lt 10 ]; then YEAR=$((YEAR - 1)); fi
          SEASON="${YEAR}$((YEAR + 1))"
          echo "Warming season $SEASON"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://wildhockey.win/api/all-team-schedules/$SEASON)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: endpoint returned $STATUS"
            exit 1
          fi
